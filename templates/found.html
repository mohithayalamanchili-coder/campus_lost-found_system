
<!DOCTYPE html>
<html>
<head>
    <title>Report Found Item</title>
</head>
<body>

    <h2>Report Found Item</h2>

    <form method="POST" enctype="multipart/form-data">

        <input type="text" name="item_name"
        placeholder="Item Name" required><br><br>

        <select name="category" required>
            <option value="">Select Category</option>
            <option>ID Card</option>
            <option>Mobile Phone</option>
            <option>Books</option>
            <option>Bag</option>
            <option>Other</option>
        </select><br><br>

        <input type="date" name="date" required><br><br>

        <input type="text" name="location"
        placeholder="Found Location" required><br><br>

        <textarea name="description"
        placeholder="Item Description"></textarea><br><br>

        <input type="email" name="email"
        placeholder="Your College Email" required><br><br>

        <label>Upload Item Photo:</label><br><br>

        <input type="file" name="image"
        accept="image/*"><br><br>

        <button type="submit">Submit Found Item</button>

    </form>

</body>
</html>
